<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>디자인 C: 완벽한 정사각형 앨범 케이스 사이드바</title>
<style>
  /* Global Settings */
  body {
    background-color: #fff;
    color: #333;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
  }
  
  .app-layout {
    display: flex;
    height: 100vh;
  }

  /* ---------------- Sidebar (좌측 1/4 폭) ---------------- */
  .sidebar {
    width: 30%;
    min-width: 320px;
    max-width: 380px;
    background-color: #fcfbf8;
    border-right: 1px solid #eaeaea;
    display: flex;
    flex-direction: column;
  }

  .sidebar-header {
    padding: 30px 0 20px;
    text-align: center;
    border-bottom: 2px solid #eaeaea;
    background-color: #fcfbf8;
    z-index: 10;
  }

  .sidebar-header h1 {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 1px;
    margin: 0;
    color: #333;
  }
  
  .sidebar-header p {
    font-size: 13px;
    color: #888;
    margin: 5px 0 0 0;
  }

  /* 오름차순으로 길게 스크롤되는 목록 영역 */
  .lp-list {
    flex: 1;
    overflow-y: auto;
    padding: 40px 0;
    display: flex;
    flex-direction: column; /* 단일 열(한 줄) 세로 스크롤 */
    align-items: center; /* 가운데 정렬 */
  }

  /* ========================================================
     진짜 '정사각형 앨범 케이스' 디자인 
     ======================================================== */
  .lp-item {
    margin-bottom: 50px; /* 앨범 사이 간격 넓게 */
    cursor: pointer;
    position: relative;
  }

  .lp-cover-art {
    width: 240px;  /* 완벽한 정사각형 형태를 위한 고정 너비 지정 */
    height: 240px; /* 너비와 동일 (비율 1:1) */
    background: #333;
    border-radius: 4px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    position: relative;
    z-index: 2;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s;
    
    /* 케이스 안에 텍스트를 인쇄된 앨범 자켓처럼 표현 */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
  }

  /* 앨범 커버 뒤에서 우측으로 빼꼼 튀어나온 검은색 LP 레코드판 */
  .lp-cover-art::after {
    content: '';
    position: absolute;
    top: 10px; right: -25px; /* 케이스보다 우측으로 삐져나옴 */
    width: 220px; height: 220px;
    background: #151515;
    border-radius: 50%;
    z-index: -1; 
    box-shadow: inset 0 0 0 4px #2a2a2a; /* 레코드 테두리 질감 */
    transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* 마우스 올렸을 때 액션 (앨범이 떠오르고 레코드가 살짝 나옴) */
  .lp-item:hover .lp-cover-art {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.2);
  }
  .lp-item:hover .lp-cover-art::after {
    right: -40px; 
  }

  /* 리스트에서 클릭되어 "활성화(재생 중)"인 상태 */
  .lp-item.active .lp-cover-art {
    transform: scale(1.05); /* 앨범이 조금 커짐 */
    box-shadow: 0 15px 30px rgba(0,0,0,0.3);
  }
  .lp-item.active .lp-cover-art::after {
    right: -100px; /* 레코드판이 많이 꺼내짐! */
  }

  /* 자켓(케이스) 위 글씨들 */
  .cover-date {
    font-size: 28px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .cover-status {
    font-size: 14px;
    font-weight: 300;
  }

  /* ---------------- Main Content (우측 메인 폭) ---------------- */
  .main-content {
    flex: 1;
    background: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  .player-container {
    display: flex;
    gap: 80px;
    align-items: center;
    opacity: 1;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  
  .player-container.fade-out {
    opacity: 0;
    transform: translateY(10px);
  }

  .turntable { display: flex; justify-content: center; }
  .record {
    width: 320px; height: 320px;
    background: #222;
    border-radius: 50%;
    position: relative;
    box-shadow: inset 0 0 0 8px #1a1a1a, 5px 15px 30px rgba(0,0,0,0.08);
  }
  .record::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 110px; height: 110px;
    background: #e6dfd3;
    border-radius: 50%;
    transition: background-color 0.5s;
  }
  
  .record.spinning { animation: spin 3s linear infinite; }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  .tracklist { width: 300px; }
  .tracklist-header {
    font-size: 20px;
    font-weight: 300;
    border-bottom: 2px solid #333;
    padding-bottom: 15px;
    margin-top: 0;
    margin-bottom: 15px;
    letter-spacing: 2px;
    color: #222;
  }
  .track {
    padding: 18px 0;
    border-bottom: 1px dashed #eaeaea;
    font-size: 16px;
    color: #444;
    display: flex;
    justify-content: space-between;
    cursor: pointer;
    transition: color 0.2s;
    align-items: center;
  }
  .track:hover { color: #000; }
  .track.completed span { text-decoration: line-through; color: #bbb; }
  .track.completed .circle { background: #444; border-color: #444; }
  
  .circle {
    width: 20px; height: 20px;
    border: 1px solid #ccc;
    border-radius: 50%;
    transition: all 0.2s;
  }

  .add-btn {
    width: 100%; padding: 16px; background: transparent;
    color: #777; border: 1px dashed #ccc; font-size: 15px;
    border-radius: 4px; cursor: pointer; margin-top: 30px;
    letter-spacing: 1px; transition: all 0.2s;
  }
  .add-btn:hover { background: #f9f9f9; border-color: #666; color: #333; }
</style>
</head>
<body>

  <div class="app-layout">
    
    <!-- 좌측 사이드바: 완전한 정사각형 앨범 케이스 뷰 -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>My LP Archive</h1>
        <p>2026년 4월</p>
      </div>
      
      <!-- 스크롤 영역: 1일 -> 2일 -> 3일 -> 오늘 오름차순 -->
      <div class="lp-list">
        
        <!-- 정사각형 앨범 케이스 1 -->
        <div class="lp-item" onclick="selectDay('1일', '#4b5d6e', this)">
          <div class="lp-cover-art" style="background: linear-gradient(135deg, #4b5d6e, #2c3e50);">
            <div class="cover-date">1일 (수)</div>
            <div class="cover-status">100% COMPLETE</div>
          </div>
        </div>

        <!-- 정사각형 앨범 케이스 2 -->
        <div class="lp-item" onclick="selectDay('2일', '#8f7b70', this)">
          <div class="lp-cover-art" style="background: linear-gradient(135deg, #e0c8b6, #8f7b70); color: #fff;">
            <div class="cover-date">2일 (목)</div>
            <div class="cover-status">80% COMPELETE</div>
          </div>
        </div>
        
        <!-- 정사각형 앨범 케이스 3 -->
        <div class="lp-item" onclick="selectDay('3일', '#d4c9b1', this)">
          <div class="lp-cover-art" style="background: linear-gradient(135deg, #A8A7A7, #555);">
            <div class="cover-date">3일 (금)</div>
            <div class="cover-status">100% COMPLETE</div>
          </div>
        </div>
        
        <!-- 정사각형 앨범 케이스 4 (오늘 - 마지막 요소) -->
        <div class="lp-item active" onclick="selectDay('오늘', '#e6dfd3', this)">
          <div class="lp-cover-art" style="background: transparent; border: 3px dashed #999; color: #555; text-shadow: none;">
            <div class="cover-date">오늘 (4일)</div>
            <div class="cover-status">NOW RECORDING...</div>
          </div>
        </div>
        
      </div>
    </div>
    
    <!-- 우측 중앙: 상세 플레이어 -->
    <div class="main-content">
      <div class="player-container" id="playerView">
        <div class="turntable">
          <div class="record" id="recordPlayer"></div>
        </div>
        
        <div class="tracklist">
          <h1 class="tracklist-header" id="trackHeader">SIDE A - 오늘</h1>
          
          <div class="track" onclick="togglePlay(this)">
            <span>01 - 커피 마시기 & 기상</span> <div class="circle"></div>
          </div>
          <div class="track" onclick="togglePlay(this)">
            <span>02 - 사이드바 UX 수정</span> <div class="circle"></div>
          </div>
          <div class="track" onclick="togglePlay(this)">
            <span>03 - 메일 확인</span> <div class="circle"></div>
          </div>
          
          <button class="add-btn">+ 새 트랙 추가</button>
        </div>
      </div>
    </div>
    
  </div>

<script>
  function selectDay(dateText, coverColor, element) {
    document.querySelectorAll('.lp-item').forEach(el => el.classList.remove('active'));
    element.classList.add('active');
    
    const playerView = document.getElementById('playerView');
    playerView.classList.add('fade-out');
    
    setTimeout(() => {
      document.getElementById('trackHeader').innerText = 'SIDE A - ' + dateText;
      
      const rootStyle = document.createElement("style");
      rootStyle.innerHTML = `.record::after { background-color: ${coverColor} !important; }`;
      document.head.appendChild(rootStyle);
      
      document.getElementById('recordPlayer').classList.remove('spinning');
      document.querySelectorAll('.track').forEach(t => t.classList.remove('completed'));
      
      playerView.classList.remove('fade-out');
    }, 300);
  }

  function togglePlay(element) {
    element.classList.toggle('completed');
    const record = document.getElementById('recordPlayer');
    record.classList.add('spinning');
  }
</script>
</body>
</html>
